name: PR checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  commitizen-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # needed so that the local composite action below can be resolved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate conventional commits
        uses: ./.github/actions/validate-conventional-commits
