name: Release - bump version & changelog

# Step 1 of the release process (manual trigger).
# Runs `cz bump --files-only --changelog` and opens a "bump: release vX.Y.Z" pull request
# against the base branch. Merging that PR triggers `release-publish.yaml`, which tags,
# publishes to PyPI and creates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      increment-type:
        type: choice
        description: Type of semver increment to perform
        default: auto
        options:
          - auto
          - PATCH
          - MINOR
          - MAJOR
          - release-candidate
          - experimental
      base-branch:
        description: The base branch for the PR to be compared to
        default: "main"

permissions: {}

jobs:
  create-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate changelog and open release PR
        uses: apheris/github-actions/generate-changelog/python-commitizen@53a666f96140badbf33d76892a122e1b4f7d11ba # v4.1.2
        with:
          increment-type: ${{ inputs.increment-type }}
          base-branch: ${{ inputs.base-branch }}
          # The releaser-apheris app secrets are not available to this repository, so the
          # built-in token is used. The bump commit is still signed: the action commits through
          # planetscale/ghcommit-action, i.e. the GraphQL API, and GitHub signs those commits
          # with its own GPG key. The commit is authored by github-actions[bot].
          token: ${{ secrets.GITHUB_TOKEN }}
