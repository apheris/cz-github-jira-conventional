name: Release - bump version & changelog

# Step 1 of the release process (manual trigger).
# Runs `cz bump --files-only --changelog` and opens a "bump: release vX.Y.Z" pull request
# against the base branch. Merging that PR triggers `release-publish.yaml`, which tags,
# publishes to PyPI and creates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      increment-type:
        type: choice
        description: Type of semver increment to perform
        default: auto
        options:
          - auto
          - PATCH
          - MINOR
          - MAJOR
          - release-candidate
      base-branch:
        description: Release base branch (main or a protected patch-release-* branch)
        default: "main"

permissions: {}

jobs:
  create-changelog:
    # $/ actions come from the workflow ref, which must be protected as well as the target base.
    if: >-
      github.ref_protected &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/patch-release-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Generate changelog and open release PR
        uses: $/.github/actions/generate-changelog
        with:
          increment-type: ${{ inputs.increment-type }}
          base-branch: ${{ inputs.base-branch }}
          # The commit is signed even though the built-in token is used: the action commits
          # through the GraphQL API, and GitHub signs those commits with its own GPG key.
          # The commit is authored by github-actions[bot].
          token: ${{ secrets.GITHUB_TOKEN }}
