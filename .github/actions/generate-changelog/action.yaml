name: Generate Changelog - Python Commitizen
description: "Bump the version, generate the changelog and open a release pull request"

# Bumps the version with commitizen, regenerates the changelog and opens a release pull request.
#
# The commitizen plugin is installed from this checkout, so a release is prepared with the version
# of the plugin that is about to be released.
#
# The pull request branch, the commit and the pull request itself are created through the GitHub API
# rather than pushed from the runner, so that the commit is signed with GitHub's GPG key and shows
# as Verified. See https://github.com/actions/runner/issues/667.

inputs:
  increment-type:
    description: Type of semver increment to perform
    required: false
    default: "auto"
  base-branch:
    description: The base branch for the PR to be compared to
    required: false
    default: "main"
  token:
    description: The GitHub token
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate release inputs
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        INCREMENT_TYPE: ${{ inputs.increment-type }}
      run: |
        case "$BASE_BRANCH" in
          */*) echo "::error::Release branch names must not contain slashes."; exit 1 ;;
          main|patch-release-*) ;;
          *) echo "::error::Releases must target main or patch-release-* branches."; exit 1 ;;
        esac
        case "$INCREMENT_TYPE" in
          auto|PATCH|MINOR|MAJOR|release-candidate) ;;
          *) echo "::error::Unsupported increment type: $INCREMENT_TYPE"; exit 1 ;;
        esac

    - name: Verify release base protection
      id: release-base
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { data: branch } = await github.rest.repos.getBranch({
            ...context.repo,
            branch: process.env.BASE_BRANCH,
          });
          if (branch.protected !== true) {
            throw new Error(`Release base ${process.env.BASE_BRANCH} is not protected.`);
          }
          core.setOutput('sha', branch.commit.sha);

    - name: Check out repo with tags
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Pin to the protected commit just verified, even if the branch moves meanwhile.
        ref: ${{ steps.release-base.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: .python-version

    - name: Install dependencies
      shell: bash
      run: python -m pip install -r requirements.txt .

    - name: Setup git user
      uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

    - name: Generate new release candidate version commit
      if: inputs.increment-type == 'release-candidate'
      shell: bash
      run: echo "INCREMENT_ARG=--prerelease rc" >> $GITHUB_ENV

    - name: Sets parameter for the --increment flag
      if: contains(fromJSON('["MAJOR", "MINOR", "PATCH"]'), inputs.increment-type)
      shell: bash
      env:
        INCREMENT_TYPE: ${{ inputs.increment-type }}
      run: echo "INCREMENT_ARG=--increment $INCREMENT_TYPE" >> $GITHUB_ENV

    - name: Generate changelog
      shell: bash
      run: |
        cz bump --files-only --changelog --yes --version-scheme semver2 ${{ env.INCREMENT_ARG }}

    - name: Next version tag
      shell: bash
      run: echo "NEXT_VERSION_TAG=v$(cz version --project)" >> "$GITHUB_ENV"

    - name: Set new branch name
      shell: bash
      run: echo "CHANGELOG_BRANCH=update-changelog-${{ env.NEXT_VERSION_TAG }}" >> $GITHUB_ENV

    - name: Use verified release base commit
      shell: bash
      env:
        BASE_SHA: ${{ steps.release-base.outputs.sha }}
      run: echo "BASE_BRANCH_SHA=$BASE_SHA" >> "$GITHUB_ENV"

    # Workaround for https://github.com/actions/runner/issues/667: the only way to get a signed
    # commit from the Actions user is to create it through the API. So we create the branch, commit
    # the locally generated changes to it through the API, and then open the pull request.
    - name: Create branch on remote
      uses: peterjgrainger/action-create-branch@4b81ce657e255acd677cc6c55c9c763654be3aef # v4.0.0
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      with:
        branch: ${{ env.CHANGELOG_BRANCH }}
        sha: ${{ env.BASE_BRANCH_SHA }}

    - name: Commit local changes to target branch
      uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      with:
        commit_message: "bump: release ${{ env.NEXT_VERSION_TAG }}"
        repo: ${{ github.repository }}
        branch: ${{ env.CHANGELOG_BRANCH }}

    - name: Create Pull Request
      id: create-pull-request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.token }}
        title: "bump: release ${{ env.NEXT_VERSION_TAG }}"
        body: Bumps the project version to ${{ env.NEXT_VERSION_TAG }} and updates the changelog to reflect the corresponding changes.
        branch: ${{ env.CHANGELOG_BRANCH }}
        base: ${{ inputs.base-branch }}

    # GITHUB_TOKEN-created pull requests do not emit pull_request events. workflow_dispatch is
    # exempt from that suppression, so explicitly run the same checks against the release PR.
    - name: Dispatch checks for the release pull request
      if: ${{ steps.create-pull-request.outputs.pull-request-number }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: "bump: release ${{ env.NEXT_VERSION_TAG }}"
      run: |
        head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CHANGELOG_BRANCH" --jq '.object.sha')
        gh workflow run pr-checks.yaml \
          --ref "$CHANGELOG_BRANCH" \
          -f "pr-title=$PR_TITLE" \
          -f "base-sha=$BASE_BRANCH_SHA" \
          -f "head-sha=$head_sha"

    - name: Add some outputs to job summary
      if: ${{ steps.create-pull-request.outputs.pull-request-number }}
      shell: bash
      run: |
        echo "Pull request [#${{ steps.create-pull-request.outputs.pull-request-number }}](${{ steps.create-pull-request.outputs.pull-request-url }}) created and its checks were dispatched." >> $GITHUB_STEP_SUMMARY

    - name: Delete created branch if job fails
      uses: dawidd6/action-delete-branch@d1efac9a6f7a9b408d4e8ff663a99c1fbac17b3f # v3.1.0
      if: failure() && env.CHANGELOG_BRANCH != ''
      with:
        soft_fail: true
        github_token: ${{ inputs.token }}
        branches: ${{ env.CHANGELOG_BRANCH }}
